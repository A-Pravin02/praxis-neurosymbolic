# =============================================================================
# Meridian Marketplace knowledge graph (fictional demonstration data).
#
# Every entity is a node; every attribute is a fact; every entity-valued
# attribute is an edge. The loader turns this into symbolic facts and a
# traversable graph. Policy constants live on the `meridian` company node so the
# rules hold only logic.
#
# `as_of` pins "today" so every answer and every benchmark result reproduces.
# =============================================================================

as_of: 2026-09-14

entities:
  # --- the company and its policy constants ----------------------------------
  - id: meridian
    type: company
    name: Meridian Marketplace
    attributes:
      cancellation_fee_rate: 0.05
      cancellation_fee_cap: 500
      free_delivery_threshold_plus: 500
      free_delivery_threshold_standard: 999
      delay_threshold_days: 3
      plus_delay_credit: 100
      senior_service_years: 3
      annual_leave_base: 18
      annual_leave_senior: 24
      min_trip_km: 50
      receipt_threshold: 2000
      claim_deadline_days: 30
      mileage_rate: 9
      approval_threshold: 25000
      goodwill_rate: 0.10
      goodwill_cap: 500

  # --- policy versions: a policy change is a new node, never a rule edit ----------
  - id: RETURNS-v1
    type: policy_version
    name: Returns policy version 1
    attributes: {policy: returns, version: 1, effective_from: 2026-01-01, damage_report_days: 7}
  - id: RETURNS-v2
    type: policy_version
    name: Returns policy version 2
    attributes: {policy: returns, version: 2, effective_from: 2026-09-01, supersedes: RETURNS-v1,
                 damage_report_days: 15}

