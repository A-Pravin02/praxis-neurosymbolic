# =============================================================================
# Meridian neuro-symbolic benchmark - TEST SET
#
# Frozen before its first run. Not used to tune any threshold (see dev.yaml for
# that). Questions were written independently of the goal and input descriptions
# in the rule files; expected answers were worked out by hand from the knowledge
# graph with "today" = 2026-09-14.
#
# Limitation, stated plainly: the same author wrote the knowledge pack and these
# questions. The "unseen" category avoids the rule files' vocabulary, but it is
# not a benchmark written by an independent party.
#
# expect fields (all optional):
#   pipeline   letter or list of acceptable letters
#   goal       goal / lookup name, list of acceptable names, or null
#   outcome    answered | conditional | clarification | insufficient | denied (or list)
#   decision   true / false for yes-no goals
#   value      number for calculations
#   subject    record the reasoning must resolve to
#   mention    substrings the answer or explanation must contain  (explanation correctness)
#   forbid     substrings that must NOT appear                      (hallucination probes)
#   clauses    policy clauses that must be among the sources        (retrieval accuracy)
#   missing    inputs the answer must report as missing
# =============================================================================

cases:
  # ---------------------------------------------------------------- 1 known
  - {id: K01, category: known, user: priya@meridian.test, question: "Can I return order 12346?",
     expect: {pipeline: B, goal: return_allowed, outcome: answered, decision: true, subject: ORD-12346, mention: ["45-day"], clauses: [RET-1]}}
  - {id: K02, category: known, user: priya@meridian.test, question: "Can I cancel order 12345?",
     expect: {pipeline: B, goal: cancellation_allowed, outcome: answered, decision: false, subject: ORD-12345, mention: ["shipped"], clauses: [CAN-3]}}
