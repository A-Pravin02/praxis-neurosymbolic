# Backend deployment for Praxis (Render blueprint).
#
# Vercel hosts the frontend; it cannot host this backend. The API needs PostgreSQL with
# pgvector for retrieval and loads a ~130 MB ONNX sentence encoder at startup, neither of
# which fits a serverless function's filesystem or cold-start budget. Splitting them is
# the architecture, not a concession: the frontend is static and belongs on a CDN, the API
# is a long-lived container that holds the model in memory.
#
# Deploy: New > Blueprint in the Render dashboard, point it at this repository.
# Everything below is declared; the only value a human supplies is JWT_SECRET, and it is
# generated by Render rather than written down anywhere.

databases:
  - name: praxis-db
    databaseName: praxis
    user: praxis_app
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: praxis-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: standard              # the encoder needs more than the starter plan's memory
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: praxis-db
          property: connectionString
      - key: ADMIN_DATABASE_URL
        fromDatabase:
          name: praxis-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true     # generated by Render; never committed, never printed
      - key: ENVIRONMENT
        value: production
      - key: EMBEDDING_PROVIDER
        value: semantic
      - key: EMBEDDING_DIMENSION
        value: "384"
      - key: LLM_PROVIDER
        value: mock             # deterministic and offline; see the note below
      - key: CORS_ORIGINS
        sync: false             # set to the Vercel URL once it exists
      - key: NEURAL_MODEL_CACHE
        value: /app/.cache/models

# Notes
#
# pgvector: run `CREATE EXTENSION IF NOT EXISTS vector;` once against the database before
# the first deploy, from the Render shell. Render's PostgreSQL ships the extension but
# does not enable it for you, and the migration that creates the vector column fails
# without it.
#
# LLM_PROVIDER is `mock` so a fresh deployment answers without any credential. To use a
# hosted model set LLM_PROVIDER=openai, LLM_BASE_URL and LLM_API_KEY in the Render
# dashboard as secret environment variables. Do not put a key in this file or in .env -
# both are committed.
#
# CORS_ORIGINS must list the frontend's real origin (https://<project>.vercel.app) before
# the browser will accept responses. It is `sync: false` so the value is set once in the
# dashboard rather than guessed here.
